name: Lat check
description: Validate Lat documentation, links, source references, and structure.
branding:
  icon: check-circle
  color: purple
inputs:
  version:
    description: Core npm version or distribution tag to install.
    default: latest
  working-directory:
    description: Project directory, relative to the checked-out workspace.
    default: '.'
  profile:
    description: Print detailed validation timings.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
    - name: Install core and check documentation
      shell: bash
      env:
        LAT_ACTION_PATH: ${{ github.action_path }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_WORKING-DIRECTORY: ${{ inputs.working-directory }}
        INPUT_PROFILE: ${{ inputs.profile }}
      run: node "$LAT_ACTION_PATH/action/index.js"
